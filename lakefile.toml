name = "EqLift"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["EqLift"]
testDriver = "EqLiftTests"

[leanOptions]
pp.unicode.fun = true                 # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"

[[lean_lib]]
name = "EqLift"

[[lean_lib]]
name = "EqLiftTests"
globs = ["EqLiftTests.+"]
